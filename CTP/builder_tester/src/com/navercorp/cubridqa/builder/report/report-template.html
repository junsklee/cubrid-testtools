<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBRID Test Results - {{REQUEST_ID}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            color: #1f2937;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .filter-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .btn.active {
            background: #374151;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .results-table {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        
        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #374151;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: inherit;
            z-index: 10;
        }
        
        th.commit-col {
            text-align: center;
            min-width: 120px;
        }
        
        tbody tr {
            border-bottom: 1px solid #e5e7eb;
            transition: all 0.2s ease;
        }
        
        tbody tr:hover {
            background: #f9fafb;
        }
        
        td {
            padding: 1rem;
        }
        
        .test-name {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .test-name:hover {
            color: #667eea;
            text-decoration: underline;
        }
        
        .result-cell {
            text-align: center;
            font-weight: 500;
        }
        
        .result-cell span {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .result-cell span:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .result-pass {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
            border-radius: 0.375rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
        }
        
        .result-fail {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
            border-radius: 0.375rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
        }
        
        .result-error {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
            border-radius: 0.375rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
        }
        
        .result-flaky {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0c4a6e;
            border-radius: 0.375rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
        }
        
        .result-skip {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            color: #6b7280;
            border-radius: 0.375rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
        }
        
        .fail-count {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .fail-count-0 {
            color: #065f46;
        }
        
        .fail-count-partial {
            color: #92400e;
        }
        
        .fail-count-all {
            color: #991b1b;
        }
        
        .verdict {
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }
        
        .verdict-unstable {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }
        
        .verdict-bug {
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #991b1b;
        }
        
        .verdict-preexisting {
            background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
            color: #3730a3;
        }
        
        .verdict-success {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }
        
        .verdict-error {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }
        
        .verdict-flaky {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #0c4a6e;
        }
        
        .export-buttons {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            z-index: 100;
        }
        
        .export-btn {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 1rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .export-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            font-size: 1.2rem;
            color: #6b7280;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.8rem; }
            .controls { flex-direction: column; }
            .search-box { width: 100%; }
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 0;
            border-radius: 1rem;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
        }
        
        .close-btn:hover {
            color: #374151;
        }
    </style>
    </head>
<body>
    <div class="container">
        <div class="header">
            <h1>CUBRID Test Results</h1>
            <div class="metadata">
                <div class="metadata-item">
                    <strong>Request ID:</strong>
                    <span>{{REQUEST_ID}}</span>
                </div>
                <div class="metadata-item">
                    <strong>Generated:</strong>
                    <span>{{TIMESTAMP}}</span>
                </div>
                <div class="metadata-item">
                    <strong>Total Tests:</strong>
                    <span id="totalTests">-</span>
                </div>
                <div class="metadata-item">
                    <strong>Commits:</strong>
                    <span id="totalCommits">-</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search test names..." />
            </div>
            <div class="filter-buttons">
                <button class="btn btn-secondary active" onclick="filterResults('all')">All</button>
                <button class="btn btn-secondary" onclick="filterResults('passed')">Passed</button>
                <button class="btn btn-secondary" onclick="filterResults('failed')">Failed</button>
                <button class="btn btn-secondary" onclick="filterResults('unstable')">Unstable</button>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" style="color: var(--success-color);" id="passedCount">0</div>
                <div class="stat-label">Tests Passed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--error-color);" id="failedCount">0</div>
                <div class="stat-label">Tests Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--warning-color);" id="unstableCount">0</div>
                <div class="stat-label">Unstable Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #92400e;" id="errorCount">0</div>
                <div class="stat-label">Error Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: #0c4a6e;" id="flakyCount">0</div>
                <div class="stat-label">Flaky Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color: var(--info-color);" id="passRate">0%</div>
                <div class="stat-label">Pass Rate</div>
            </div>
        </div>
        
        <div class="results-table">
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr id="tableHeader">
                            <th>Test Case</th>
                            <th>Fail Num</th>
                            <th>Verdict</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="loading">Loading results...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="export-buttons">
        <button class="export-btn" onclick="viewBuildLogs()" title="View Build Logs">Build Logs</button>
        <button class="export-btn" onclick="exportJSON()" title="Export as JSON">JSON</button>
        <button class="export-btn" onclick="exportCSV()" title="Export as CSV">CSV</button>
    </div>
    
    <!-- Modal for viewing details -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Test Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script>
        // Parse the embedded JSON data
        const rawData = {{RESULTS_JSON}};
        let processedData = {};
        let commits = [];
        let currentFilter = 'all';
        
        window.addEventListener('DOMContentLoaded', () => {
            processData();
            renderTable();
            setupEventListeners();
        });
        
        function processData() {
            const commitSet = new Set();
            const testGroups = {};
            const results = rawData.results || rawData;
            if (Array.isArray(results)) {
                results.forEach(result => {
                    const commit = result.commit || 'unknown';
                    const test = result.test || 'unknown';
                    const status = result.status || 'error';
                    const flaky = result.flaky || false;
                    const attempts = result.attempts || 1;
                    const attemptLogMetadata = result.attemptLogMetadata || null;
                    
                    commitSet.add(commit);
                    if (!testGroups[test]) {
                        testGroups[test] = {};
                    }
                    
                    // Always store full result object to preserve attemptLogMetadata
                    testGroups[test][commit] = {
                        status: status,
                        flaky: flaky,
                        attempts: attempts,
                        attemptLogMetadata: attemptLogMetadata
                    };
                });
            }
            commits = Array.from(commitSet).sort();
            processedData = testGroups;
            document.getElementById('totalTests').textContent = Object.keys(testGroups).length;
            document.getElementById('totalCommits').textContent = commits.length;
            updateStatistics();
        }
        
        function updateStatistics() {
            let totalTests = 0, passedTests = 0, failedTests = 0, unstableTests = 0, errorTests = 0, flakyTests = 0;
            Object.keys(processedData).forEach(test => {
                const verdict = getTestVerdict(test);
                totalTests++;
                
                if (verdict.class === 'verdict-success') passedTests++;
                else if (verdict.class === 'verdict-bug' || verdict.class === 'verdict-preexisting') failedTests++;
                else if (verdict.class === 'verdict-unstable') unstableTests++;
                else if (verdict.class === 'verdict-error') errorTests++;
                else if (verdict.class === 'verdict-flaky') flakyTests++;
            });
            
            document.getElementById('passedCount').textContent = passedTests;
            document.getElementById('failedCount').textContent = failedTests;
            document.getElementById('unstableCount').textContent = unstableTests;
            document.getElementById('errorCount').textContent = errorTests;
            document.getElementById('flakyCount').textContent = flakyTests;
            const passRate = totalTests > 0 ? Math.round((passedTests / totalTests) * 100) : 0;
            document.getElementById('passRate').textContent = passRate + '%';
        }
        
        function calculateFailCount(testName) {
            let failCount = 0;
            commits.forEach(commit => {
                const resultData = processedData[testName][commit];
                let status;
                if (typeof resultData === 'object' && resultData.status) {
                    status = resultData.status;
                } else {
                    status = resultData || 'error';
                }
                if (status !== 'pass') failCount++;
            });
            return failCount;
        }
        
        function getTestVerdict(testName) {
            // Check for flaky test first - look for any result marked as flaky
            let hasFlaky = false;
            let maxAttempts = 1;
            
            commits.forEach(commit => {
                const resultData = processedData[testName][commit];
                if (resultData && typeof resultData === 'object') {
                    if (resultData.flaky) hasFlaky = true;
                    if (resultData.attempts > maxAttempts) maxAttempts = resultData.attempts;
                }
            });
            
            if (hasFlaky) {
                return { text: 'Flaky: Passed after ' + maxAttempts + ' attempts', class: 'verdict-flaky' };
            }
            
            // Check for errors (execution_error, environment_error, build_error)
            const errorCommits = [];
            const buildErrs = [];
            commits.forEach(commit => {
                const resultData = processedData[testName][commit];
                let status;
                if (typeof resultData === 'object' && resultData.status) {
                    status = resultData.status;
                } else {
                    status = resultData || 'error';
                }
                
                const statusLower = status.toString().toLowerCase();
                if (statusLower === 'build_failed') {
                    buildErrs.push(commit.substring(0,7));
                } else if (statusLower === 'execution_error' || statusLower === 'environment_error' || statusLower === 'error') {
                    errorCommits.push(commit.substring(0,7));
                }
            });
            
            if (buildErrs.length > 0) {
                return { text: 'Build errors in: ' + buildErrs.join(', '), class: 'verdict-bug' };
            }
            if (errorCommits.length > 0) {
                return { text: 'Error: Test execution failed', class: 'verdict-error' };
            }
            
            // Fall back to traditional verdict logic
            const failCount = calculateFailCount(testName);
            return getVerdict(testName, failCount);
        }
        
        function getVerdict(testName, failCount) {
            const numCommits = commits.length;
            
            if (failCount === 0) {
                return { text: 'Pass: Not reproduced across listed commits', class: 'verdict-success' };
            } else if (failCount === 1) {
                let failedCommit = null;
                for (let i=0;i<commits.length;i++) {
                    const c = commits[i];
                    const resultData = processedData[testName][c];
                    let status;
                    if (typeof resultData === 'object' && resultData.status) {
                        status = resultData.status;
                    } else {
                        status = resultData || 'error';
                    }
                    if (status !== 'pass') { 
                        failedCommit = c.substring(0,7); 
                        break; 
                    }
                }
                return { text: 'Bug or Revise: Caused by ' + failedCommit, class: 'verdict-bug' };
            } else if (failCount === numCommits) {
                return { text: 'Pre-existing Failure: Likely not caused by listed commits', class: 'verdict-preexisting' };
            } else {
                return { text: 'Unstable: Fails intermittently across commits', class: 'verdict-unstable' };
            }
        }
        
        function renderTable() {
            const headerRow = document.getElementById('tableHeader');
            const tbody = document.getElementById('tableBody');
            // Rebuild header explicitly to ensure correct order and column visibility
            headerRow.innerHTML = '';
            const thTest = document.createElement('th'); thTest.textContent = 'Test Case'; headerRow.appendChild(thTest);
            commits.forEach(commit => {
                const th = document.createElement('th');
                th.className = 'commit-col';
                th.textContent = commit.substring(0, 7);
                th.title = commit;
                headerRow.appendChild(th);
            });
            const thFail = document.createElement('th'); thFail.textContent = 'Fail Num'; headerRow.appendChild(thFail);
            const thVerdict = document.createElement('th'); thVerdict.textContent = 'Verdict'; headerRow.appendChild(thVerdict);
            tbody.innerHTML = '';
            const tests = Object.keys(processedData).sort();
            if (tests.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (commits.length + 3) + '" class="no-results">No test results found</td></tr>';
                return;
            }
            tests.forEach(test => {
                const row = createTestRow(test);
                if (row) tbody.appendChild(row);
            });
        }
        
        function createTestRow(testName) {
            const verdict = getTestVerdict(testName);
            const failCount = calculateFailCount(testName);
            
            if (currentFilter !== 'all') {
                if (currentFilter === 'passed' && verdict.class !== 'verdict-success' && verdict.class !== 'verdict-flaky') return null;
                if (currentFilter === 'failed' && verdict.class !== 'verdict-bug' && verdict.class !== 'verdict-preexisting') return null;
                if (currentFilter === 'unstable' && verdict.class !== 'verdict-unstable') return null;
            }
            const row = document.createElement('tr');
            const testCell = document.createElement('td');
            testCell.className = 'test-name';
            testCell.textContent = testName;
            testCell.onclick = () => viewTestDetails(testName);
            row.appendChild(testCell);
            commits.forEach(commit => {
                const cell = document.createElement('td');
                cell.className = 'result-cell';
                const resultData = processedData[testName][commit];
                let status, isFlaky = false, attempts = 1;
                
                if (typeof resultData === 'object' && resultData.status) {
                    status = resultData.status;
                    isFlaky = resultData.flaky || false;
                    attempts = resultData.attempts || 1;
                } else {
                    status = resultData || 'error';
                }
                
                let statusClass = 'result-skip';
                let statusText = 'N/A';
                switch(status) {
                    case 'pass': 
                        statusClass = isFlaky ? 'result-flaky' : 'result-pass';
                        statusText = isFlaky ? 'FLAKY(' + attempts + ')' : 'PASS';
                        break;
                    case 'flaky':
                        statusClass = 'result-flaky';
                        statusText = 'FLAKY(' + attempts + ')';
                        break;
                    case 'fail': statusClass = 'result-fail'; statusText = 'FAIL'; break;
                    case 'build_failed': statusClass = 'result-error'; statusText = 'BUILD'; break;
                    case 'execution_error':
                    case 'environment_error':
                    case 'error': statusClass = 'result-error'; statusText = 'ERROR'; break;
                }
                cell.innerHTML = "<span class=\"" + statusClass + "\" onclick=\"viewTestLog('" + testName + "', '" + commit + "')\">" + statusText + "</span>";
                row.appendChild(cell);
            });
            const failCountCell = document.createElement('td');
            let failCountClass = 'fail-count';
            if (failCount === 0) failCountClass += ' fail-count-0';
            else if (failCount === commits.length) failCountClass += ' fail-count-all';
            else failCountClass += ' fail-count-partial';
            failCountCell.className = failCountClass;
            failCountCell.textContent = failCount;
            row.appendChild(failCountCell);
            const verdictCell = document.createElement('td');
            verdictCell.innerHTML = "<span class=\"verdict " + verdict.class + "\">" + verdict.text + "</span>";
            row.appendChild(verdictCell);
            return row;
        }
        
        function filterResults(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-buttons .btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        }
        
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const rows = document.querySelectorAll('#tableBody tr');
                rows.forEach(row => {
                    const testName = row.querySelector('.test-name');
                    if (testName) {
                        const text = testName.textContent.toLowerCase();
                        row.style.display = text.includes(searchTerm) ? '' : 'none';
                    }
                });
            });
        }
        
        function exportJSON() {
            const exportData = { requestId: "{{REQUEST_ID}}", timestamp: "{{TIMESTAMP}}", commits, results: processedData };
            const blob = new Blob([JSON.stringify(exportData, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

        }

        // View test details modal
        function viewTestDetails(testName) {
            const verdict = getTestVerdict(testName);
            const failCount = calculateFailCount(testName);
            
            // Extract script name for display
            const testScript = testName.substring(testName.lastIndexOf('/') + 1);
            
            let content = '<div style="padding: 1.5rem;">';
            content += '<h3>Test Details: ' + testScript + '</h3>';
            content += '<p style="font-size: 0.9em; color: #6b7280; margin-bottom: 1rem;"><strong>Full Path:</strong> ' + testName + '</p>';
            content += '<div style="margin-bottom: 1rem;">';
            content += '<p><strong>Verdict:</strong> <span class="verdict ' + verdict.class + '">' + verdict.text + '</span></p>';
            content += '<p><strong>Failed Count:</strong> ' + failCount + ' out of ' + commits.length + ' commits</p>';
            content += '</div>';
            
            content += '<h4>Results by Commit:</h4>';
            content += '<table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">';
            content += '<tr style="background: #f3f4f6;"><th style="padding: 0.5rem; border: 1px solid #e5e7eb;">Commit</th><th style="padding: 0.5rem; border: 1px solid #e5e7eb;">Status</th><th style="padding: 0.5rem; border: 1px solid #e5e7eb;">Actions</th></tr>';
            
            commits.forEach(commit => {
                const resultData = processedData[testName][commit];
                let status, isFlaky = false, attempts = 1;
                
                if (typeof resultData === 'object' && resultData.status) {
                    status = resultData.status;
                    isFlaky = resultData.flaky || false;
                    attempts = resultData.attempts || 1;
                } else {
                    status = resultData || 'error';
                }
                
                let statusClass = 'result-skip';
                let statusText = 'N/A';
                switch(status) {
                    case 'pass': 
                        statusClass = isFlaky ? 'result-flaky' : 'result-pass';
                        statusText = isFlaky ? 'FLAKY(' + attempts + ')' : 'PASS';
                        break;
                    case 'flaky':
                        statusClass = 'result-flaky';
                        statusText = 'FLAKY(' + attempts + ')';
                        break;
                    case 'fail': statusClass = 'result-fail'; statusText = 'FAIL'; break;
                    case 'build_failed': statusClass = 'result-error'; statusText = 'BUILD'; break;
                    case 'execution_error':
                    case 'environment_error':
                    case 'error': statusClass = 'result-error'; statusText = 'ERROR'; break;

            document.getElementById('detailModal').style.display = 'block';

        // View test log for specific test and commit
        async function viewTestLog(testName, commit) {
            const requestId = '{{REQUEST_ID}}';
            const commitShort = commit.substring(0, 7);
            
            try {
                // Try to get test logs first
                const testResponse = await fetch(`/api/logs/${requestId}/tests`);
                if (testResponse.ok) {
                    const testFiles = await testResponse.json();
                    
                    // Extract just the script name like the Builder does: testPath -> testScript -> testName
                    const testScript = testName.substring(testName.lastIndexOf('/') + 1);
                    const extractedTestName = testScript.replace('.sh', '');
                    const safeTestName = extractedTestName.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    
                    // Try multiple log file patterns (docker_opt, docker, direct, test)
                    const logPatterns = [
                        `docker_opt_${commitShort}_${safeTestName}`,
                        `docker_${commitShort}_${safeTestName}`,
                        `direct_${commitShort}_${safeTestName}`,
                        `test_${commitShort}_${safeTestName}`
                    ];
                    
                    let testLogFile = null;
                    for (const pattern of logPatterns) {
                        // Look for exact match or with attempt number (.2.log, .3.log, etc.)
                        const matchingFile = testFiles.find(file => 
                            file.startsWith(pattern + '.log') || 
                            file.match(new RegExp(`^${pattern}\\.\\d+\\.log$`))
                        );
                        if (matchingFile) {
                            testLogFile = matchingFile;
                            break;
                        }
                    }
                    
                    // If we have multiple attempts, find all relevant log files
                    if (!testLogFile) {
                        // Fallback: find any file that contains the test name and commit
                        const candidateFiles = testFiles.filter(file => 
                            file.includes(safeTestName) && file.includes(commitShort) && file.endsWith('.log')
                        );
                        if (candidateFiles.length > 0) {
                            testLogFile = candidateFiles[0]; // Will be handled by showMultipleLogOptions
                        }
                    }
                    
                    // Check if we have multiple log files for this test (different attempts across all commits)
                    const allLogFiles = testFiles.filter(file => {
                        // Include files that match the test name, regardless of commit
                        return file.includes(safeTestName) && file.endsWith('.log');
                    });
                    
                    // If we found the specific file for this commit, but there are other logs for this test
                    if (testLogFile && allLogFiles.length > 1) {
                        // Show options for all available log files for this test
                        showMultipleLogOptions(testName, commitShort, allLogFiles, requestId);
                        return;
                    } else if (!testLogFile && allLogFiles.length > 0) {
                        // No exact match found, but we have some logs for this test
                        showMultipleLogOptions(testName, commitShort, allLogFiles, requestId);
                        return;
                    }
                    
                    if (testLogFile) {
                        const logResponse = await fetch(`/api/log/${requestId}/tests/${testLogFile}`);
                        if (logResponse.ok) {
                            const logContent = await logResponse.text();
                            let content = '<div style="padding: 1.5rem;">';
                            content += '<h3>Test Log: ' + testName + ' @ ' + commitShort + '</h3>';
                            content += '<pre style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; white-space: pre-wrap; max-height: 400px;">';
                            content += logContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                            content += '</pre>';
                            content += '</div>';
                            
                            document.getElementById('modalTitle').textContent = 'Test Execution Log';
                            document.getElementById('modalBody').innerHTML = content;
                            document.getElementById('detailModal').style.display = 'block';
                            return;
                        }
                    }
                }
                
                // Check if multiple attempt logs are embedded in the JSON result (for remote testers)
                const resultData = processedData[testName][commit];
                if (resultData && typeof resultData === 'object' && resultData.allAttemptLogs) {
                    // Show multiple embedded logs from remote tester
                    showEmbeddedMultipleLogs(testName, commitShort, resultData.allAttemptLogs);
                    return;
                }
                // Check if single log content is embedded in the JSON result (for remote testers)
                else if (resultData && typeof resultData === 'object' && resultData.logContent) {
                    let content = '<div style="padding: 1.5rem;">';
                    content += '<h3>Test Log: ' + testName + ' @ ' + commitShort + '</h3>';
                    content += '<p style="color: #f59e0b; margin-bottom: 1rem;"><strong>Note:</strong> Log from remote tester (embedded in JSON response)</p>';
                    content += '<pre style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; white-space: pre-wrap; max-height: 400px;">';
                    content += resultData.logContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    content += '</pre>';
                    if (resultData.logTruncated) {
                        content += '<p style="color: #f59e0b; font-size: 0.9rem; margin-top: 0.5rem;"><em>Note: Log was truncated for network transfer</em></p>';
                    }
                    content += '</div>';
                    
                    document.getElementById('modalTitle').textContent = 'Test Execution Log';
                    document.getElementById('modalBody').innerHTML = content;
                    document.getElementById('detailModal').style.display = 'block';
                    return;
                }
                
                // Fallback: show test result information
                let content = '<div style="padding: 1.5rem;">';
                content += '<h3>Test Result: ' + testName + ' @ ' + commitShort + '</h3>';
                content += '<p>Test log not available. This might be because:</p>';
                content += '<ul style="margin-left: 2rem; margin-top: 1rem;">';
                content += '<li>The test was executed with docker_optimized mode and log transfer is not yet implemented</li>';
                content += '<li>The log file was not created or has been cleaned up</li>';
                content += '<li>The test failed during build phase</li>';
                content += '</ul>';
                
                // Show what we do know about this result
                if (resultData) {
                    content += '<div style="margin-top: 1rem; padding: 1rem; background: #f3f4f6; border-radius: 0.5rem;">';
                    content += '<h4>Available Information:</h4>';
                    if (typeof resultData === 'object') {
                        content += '<p><strong>Status:</strong> ' + resultData.status + '</p>';
                        if (resultData.flaky) content += '<p><strong>Flaky:</strong> Yes (passed after ' + resultData.attempts + ' attempts)</p>';
                        if (resultData.attempts > 1) content += '<p><strong>Attempts:</strong> ' + resultData.attempts + '</p>';
                    } else {
                        content += '<p><strong>Status:</strong> ' + resultData + '</p>';
                    }
                    content += '</div>';
                }
                
                content += '</div>';
                
                document.getElementById('modalTitle').textContent = 'Test Information';
                document.getElementById('modalBody').innerHTML = content;
                document.getElementById('detailModal').style.display = 'block';
                
            } catch (error) {
                console.error('Error loading test log:', error);
                alert('Error loading test log.');
            }
        }
        
        // Show multiple log file options for tests across commits and attempts
        function showMultipleLogOptions(testName, clickedCommitShort, logFiles, requestId) {
            const testScript = testName.substring(testName.lastIndexOf('/') + 1);
            
            // Parse and group log files by commit and attempt
            const logGroups = {};
            logFiles.forEach(file => {
                // Extract commit and attempt from filename (e.g., docker_opt_b8505c4_cbrd_25894.2.log)
                const match = file.match(/.*_([a-f0-9]{7})_.*?(?:\.(\d+))?\.log$/);
                if (match) {
                    const commit = match[1];
                    const attempt = match[2] ? parseInt(match[2]) : 1;
                    
                    if (!logGroups[commit]) {
                        logGroups[commit] = [];
                    }
                    logGroups[commit].push({ file, attempt });
                }
            });
            
            // Sort commits and attempts
            Object.keys(logGroups).forEach(commit => {
                logGroups[commit].sort((a, b) => a.attempt - b.attempt);
            });
            
            let content = '<div style="padding: 1.5rem;">';
            content += '<h3>Test Execution Logs: ' + testScript + '</h3>';
            content += '<p style="margin-bottom: 1rem;">Multiple execution logs found across commits and attempts:</p>';
            
            // Group by commit
            Object.keys(logGroups).sort().forEach(commit => {
                const isClickedCommit = commit === clickedCommitShort;
                content += '<div style="margin-bottom: 1.5rem; padding: 1rem; border: 2px solid ' + 
                          (isClickedCommit ? '#667eea' : '#e5e7eb') + '; border-radius: 0.5rem; background: ' +
                          (isClickedCommit ? '#f0f4ff' : '#f9fafb') + ';">';
                content += '<h4 style="margin: 0 0 0.75rem 0; color: ' + (isClickedCommit ? '#1e40af' : '#374151') + ';">';
                content += 'Commit ' + commit;
                if (isClickedCommit) content += ' <span style="font-size: 0.8rem;">(clicked)</span>';
                content += '</h4>';
                
                // Get attempt metadata for this commit if available
                const metadata = getAttemptMetadata(testName, commit);
                
                logGroups[commit].forEach(({ file, attempt }) => {
                    // Try to find status from metadata
                    let status = 'unknown';
                    if (metadata) {
                        const attemptData = metadata.find(m => m.attempt === attempt);
                        if (attemptData && attemptData.status) {
                            status = attemptData.status;
                        }
                    }
                    
                    const colors = getStatusColors(status);
                    
                    content += '<div style="margin-bottom: 0.5rem;">';
                    content += '<button onclick="loadSpecificTestLog(\'' + requestId + '\', \'' + file + '\', \'' + testName + '\', \'' + commit + '\', ' + attempt + ')" ';
                    content += 'style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid ' + colors.border + '; ';
                    content += 'background: ' + colors.background + '; color: ' + colors.text + '; ';
                    content += 'border-radius: 0.25rem; cursor: pointer; text-align: left; font-family: monospace; font-size: 0.85rem;">';
                    content += formatStatusText(status, attempt);
                    content += '<br><span style="font-size: 0.75rem; opacity: 0.7;">' + file + '</span>';
                    content += '</button>';
                    content += '</div>';
                });
                
                content += '</div>';
            });
            
            content += '<p style="margin-top: 1rem; font-size: 0.9rem; color: #6b7280;">';
            content += '<strong>Note:</strong> First attempts typically show failures, later attempts show retry behavior. ';
            content += 'Each commit may have different execution results.';
            content += '</p>';
            content += '</div>';
            
            document.getElementById('modalTitle').textContent = 'Multiple Test Logs Available';
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        // Load specific test log file
        async function loadSpecificTestLog(requestId, fileName, testName, commitShort, attemptNum) {
            try {
                const response = await fetch(`/api/log/${requestId}/tests/${fileName}`);
                if (response.ok) {
                    const logContent = await response.text();
                    const testScript = testName.substring(testName.lastIndexOf('/') + 1);
                    
                    let content = '<div style="padding: 1.5rem;">';
                    content += '<h3>Test Log: ' + testScript + ' @ ' + commitShort + ' (Attempt ' + attemptNum + ')</h3>';
                    content += '<div style="margin-bottom: 1rem;">';
                    content += '<button onclick="goBackToLogOptions(\'' + testName + '\', \'' + commitShort + '\', \'' + requestId + '\')" ';
                    content += 'style="padding: 0.5rem 1rem; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 0.25rem; cursor: pointer;">';
                    content += '&larr; Back';
                    content += '</button>';
                    content += '</div>';
                    content += '<pre style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; white-space: pre-wrap; max-height: 400px;">';
                    content += logContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    content += '</pre>';
                    content += '</div>';
                    
                    document.getElementById('modalTitle').textContent = 'Test Execution Log (Attempt ' + attemptNum + ')';
                    document.getElementById('modalBody').innerHTML = content;
                } else {
                    alert('Failed to load log file: ' + fileName);
                }
            } catch (error) {
                console.error('Error loading specific test log:', error);
                alert('Error loading log file.');
            }
        }
        
        // Helper function to get status colors based on actual test result
        function getStatusColors(status) {
            const statusLower = status.toLowerCase();
            switch (statusLower) {
                case 'pass':
                    return { border: '#10b981', background: '#f0fdf4', text: '#166534' };
                case 'flaky':
                    return { border: '#f59e0b', background: '#fef3c7', text: '#d97706' };  // Orange/amber for flaky
                case 'fail':
                    return { border: '#ef4444', background: '#fef2f2', text: '#991b1b' };
                case 'execution_error':
                case 'environment_error':
                case 'error':
                    return { border: '#f59e0b', background: '#fefbf2', text: '#92400e' };
                default:
                    return { border: '#6b7280', background: '#f9fafb', text: '#374151' };
            }
        }
        
        // Helper function to format status text without emojis
        function formatStatusText(status, attemptNum) {
            return 'Attempt ' + attemptNum + ' - ' + status.toUpperCase();
        }
        
        // Helper function to get attempt metadata for a specific test and commit
        function getAttemptMetadata(testName, commitShort) {
            if (processedData && processedData[testName]) {
                // Find the full commit hash that starts with the short hash
                const fullCommit = Object.keys(processedData[testName]).find(c => c.startsWith(commitShort));
                if (fullCommit && processedData[testName][fullCommit]) {
                    const result = processedData[testName][fullCommit];
                    if (result.attemptLogMetadata && Array.isArray(result.attemptLogMetadata)) {
                        return result.attemptLogMetadata;
                    }
                }
            }
            return null;
        }
        
        // Enhanced back navigation that maintains context
        async function goBackToLogOptions(testName, clickedCommitShort, requestId) {
            try {
                // Get all log files for this test
                const testResponse = await fetch(`/api/logs/${requestId}/tests`);
                if (testResponse.ok) {
                    const testFiles = await testResponse.json();
                    
                    // Extract just the script name
                    const testScript = testName.substring(testName.lastIndexOf('/') + 1);
                    const extractedTestName = testScript.replace('.sh', '');
                    const safeTestName = extractedTestName.replace(/[^a-zA-Z0-9_.-]/g, '_');
                    
                    // Find all log files for this test
                    const allLogFiles = testFiles.filter(file => 
                        file.includes(safeTestName) && file.endsWith('.log')
                    );
                    
                    showMultipleLogOptions(testName, clickedCommitShort, allLogFiles, requestId);
                } else {
                    console.error('Failed to load test files');
                    showMultipleLogOptions(testName, clickedCommitShort, [], requestId);
                }
            } catch (error) {
                console.error('Error in back navigation:', error);
                showMultipleLogOptions(testName, clickedCommitShort, [], requestId);
            }
        }
        
        // Show embedded multiple logs from remote tester JSON payload
        function showEmbeddedMultipleLogs(testName, commitShort, allAttemptLogs) {
            const testScript = testName.substring(testName.lastIndexOf('/') + 1);
            
            let content = '<div style="padding: 1.5rem;">';
            content += '<h3>Test Execution Logs: ' + testScript + ' @ ' + commitShort + '</h3>';
            content += '<p style="color: #f59e0b; margin-bottom: 1rem;"><strong>Note:</strong> Multiple logs from remote tester (embedded in JSON response)</p>';
            content += '<p style="margin-bottom: 1rem;">Select an attempt to view:</p>';
            
            allAttemptLogs.forEach((attemptLog, index) => {
                const attemptNum = attemptLog.attempt;
                const status = attemptLog.status || 'unknown';
                const colors = getStatusColors(status);
                
                content += '<div style="margin-bottom: 0.75rem;">';
                content += '<button onclick="showEmbeddedLog(\'' + testName + '\', \'' + commitShort + '\', ' + index + ', ' + JSON.stringify(allAttemptLogs).replace(/"/g, '&quot;') + ')" ';
                content += 'style="width: 100%; padding: 0.75rem; border: 2px solid ' + colors.border + '; ';
                content += 'background: ' + colors.background + '; color: ' + colors.text + '; ';
                content += 'border-radius: 0.5rem; cursor: pointer; text-align: left; font-family: monospace; font-size: 0.9rem;">';
                content += formatStatusText(status, attemptNum);
                content += '<br><span style="font-size: 0.8rem; opacity: 0.8;">' + attemptLog.logFileName + '</span>';
                if (attemptLog.logTruncated) {
                    content += ' <span style="color: #f59e0b;">(truncated)</span>';
                }
                content += '</button>';
                content += '</div>';
            });
            
            content += '<p style="margin-top: 1rem; font-size: 0.9rem; color: #6b7280;">';
            content += '<strong>Note:</strong> These logs were transferred from remote tester via JSON payload. ';
            content += 'First attempts typically show failures, later attempts show retry behavior.';
            content += '</p>';
            content += '</div>';
            
            document.getElementById('modalTitle').textContent = 'Multiple Embedded Test Logs';
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('detailModal').style.display = 'block';
        }
        
        // Show specific embedded log content
        function showEmbeddedLog(testName, commitShort, logIndex, allAttemptLogs) {
            const attemptLog = allAttemptLogs[logIndex];
            const testScript = testName.substring(testName.lastIndexOf('/') + 1);
            
            let content = '<div style="padding: 1.5rem;">';
            content += '<h3>Test Log: ' + testScript + ' @ ' + commitShort + ' (Attempt ' + attemptLog.attempt + ')</h3>';
            content += '<p style="color: #f59e0b; margin-bottom: 1rem;"><strong>Note:</strong> Log from remote tester (embedded in JSON)</p>';
            content += '<div style="margin-bottom: 1rem;">';
            content += '<button onclick="showEmbeddedMultipleLogs(\'' + testName + '\', \'' + commitShort + '\', ' + JSON.stringify(allAttemptLogs).replace(/"/g, '&quot;') + ')" ';
            content += 'style="padding: 0.5rem 1rem; border: 1px solid #d1d5db; background: #f9fafb; border-radius: 0.25rem; cursor: pointer;">';
            content += '&larr; Back</button>';
            content += '</div>';
            content += '<pre style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; white-space: pre-wrap; max-height: 400px;">';
            content += attemptLog.logContent.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            content += '</pre>';
            if (attemptLog.logTruncated) {
                content += '<p style="color: #f59e0b; font-size: 0.9rem; margin-top: 0.5rem;"><em>Note: Log was truncated for network transfer</em></p>';
            }
            content += '</div>';
            
            document.getElementById('modalTitle').textContent = 'Test Execution Log (Attempt ' + attemptLog.attempt + ')';
            document.getElementById('modalBody').innerHTML = content;
        }
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
