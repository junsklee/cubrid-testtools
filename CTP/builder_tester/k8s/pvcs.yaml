# Persistent Volume Claims for storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: builder-workspace-pvc
  namespace: cubrid-testing
spec:
  accessModes:
  - ReadWriteMany  # Required for multi-node access
  resources:
    requests:
      storage: 100Gi
  storageClassName: local-path
---
