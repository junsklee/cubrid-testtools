# VM tester of the local regression-VM stand-in (vm_sim): execution_mode=vm, see docs/VM_MODE.md
tester_port=8090
execution_mode=vm
tester_advertised_address=@ADVERTISED@
work_dir=~/tmp/tester_work
cubrid_src_dir=~/cubrid
shell_tc_dir=~/cubrid-testcases-private-ex
shell_tc_branch=develop
shell_tc_preferred_remote=origin
shell_tc_sync_mode=per_request
sql_tc_dir=~/cubrid-testcases
sql_tc_branch=develop
sql_tc_preferred_remote=origin
sql_tc_sync_mode=per_request
vm_cubrid_home=~/CUBRID
vm_ctp_home=~/CTP
vm_testcase_timeout_in_secs=7200
test_read_timeout_minutes=130
vm_keep_artifacts=fail
stats_enabled=false
wal_collection_enabled=false
actual_sampling_enabled=false
max_request_logs=50
enable_request_grouping=true
