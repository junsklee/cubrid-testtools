# Tester configuration for a QA VM (execution_mode=vm)
#
# Runs shell cases one at a time on a dedicated VM, as the VM's own user, with the
# VM's own CTP, against a build installed into vm_cubrid_home. Each case goes through
# the same steps CTP shell applies in QAHome regression: process reset, conf/databases
# restore from ~/.CUBRID_SHELL_FM, ulimit -c unlimited, TEST_SSH_* exports, the case,
# then do_check_more_errors (core files / FATAL ERROR => NOK).
#
# The VM must be dedicated to testing: like CTP, every case starts by killing the
# user's cub*/csql/broker/sleep/expect processes and its non-CTP java processes, and
# by removing its shared memory segments. vm_cubrid_home and ~/.CUBRID_SHELL_FM are
# replaced whenever a new build arrives.
#
# Start on the VM with:  ./bin/start_tester.sh $PWD/conf/tester_vm.conf
# and list the VM in the build request's workerIps (or smart_scheduling_tester_nodes).

tester_port=8090
execution_mode=vm
# host:port other nodes reach this tester on, reported as its nodeId. Only needed when the
# tester sits behind a published/forwarded port (e.g. a container published as host:18090).
#tester_advertised_address=

# Shell testcases checkout. Keep it under $HOME: CTP resolves scenarios relative to
# $HOME and some cases assume /home/$USER paths. Each request gets a git worktree of the
# requested commit under work_dir, and each attempt restores the case directory first.
shell_tc_dir=~/cubrid-testcases-private-ex
shell_tc_branch=develop
shell_tc_preferred_remote=upstream
shell_tc_sync_mode=per_request
work_dir=~/tmp/tester_work

# Required by the config loader; not used in vm mode.
cubrid_src_dir=~/cubrid

# CUBRID installation the cases run against (CTP's $CUBRID).
vm_cubrid_home=~/CUBRID
# CTP checkout whose shell/init_path and common/script the cases use. Empty = ~/CTP.
vm_ctp_home=~/CTP

# Same meaning as CTP's testcase_timeout_in_secs.
vm_testcase_timeout_in_secs=7200
# Builder -> Tester read timeout must outlast one case plus the build install.
test_read_timeout_minutes=130

# CTP regression settings the cases can see; match the VM's regression conf.
vm_ssh_port=22
#vm_big_space_dir=
#vm_default_dbcharset=
#vm_ignore_core_by_keywords=

# Archive what a case left in its directory (and $CUBRID/log): fail (default), always, never.
vm_keep_artifacts=fail

# Container-mode features that do not apply on a VM.
stats_enabled=false
wal_collection_enabled=false
actual_sampling_enabled=false

max_request_logs=50
enable_request_grouping=true
