# Builder Service Configuration

# Server configuration
listen_port=8089
max_concurrent_builds=4

# Source directories
cubrid_src_dir=~/cubrid
shell_tc_dir=~/cubrid-testcases-private-ex
# Optional: branch of shell testcases repo to use (if not available, fallback to origin)
# Applies only to the repo at shell_tc_dir. Default is 'develop'.
shell_tc_branch=develop

# Build configuration
build_arg=-g ninja -m debug build
build_dir=build_x86_64_debug

# Working directory
work_dir=/tmp/builder_work

# Tester service configuration
tester_port=8090

# Docker configuration
use_docker=true
use_prebuilt_docker_images=true
docker_build_image=cubridci/cubridci:develop
docker_test_image=cubridci/cubridci:test_shell

# Keep failed test containers alive for debugging (true/false)
keep_failed_containers=false

# Build timeout (minutes)
build_timeout_minutes=180

# Build cache configuration
build_cache_size=20

# Ccache configuration (compiler cache for faster rebuilds)
ccache_enabled=true
ccache_dir=$HOME/docker-work/work/.ccache
ccache_max_size=5G
ccache_compilercheck=content
ccache_hardlink=false

# Parallel build configuration
# Number of parallel jobs for make/ninja (0 = auto-detect from CPU cores)
parallel_jobs=0

# Log management configuration
# Maximum number of request log directories to keep
max_request_logs=5

# Maximum number of tar build files to keep in work directory
max_tar_files=10

# Enable request-based log grouping (true/false)
enable_request_grouping=true
