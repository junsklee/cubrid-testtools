# Builder Service Configuration

# Server configuration
listen_port=8089
max_concurrent_builds=4

# Source directories
cubrid_src_dir=~/cubrid
shell_tc_dir=~/cubrid-testcases-private-ex
# Optional overlay configuration. When multiple containers share a read-only
# checkout, the builder creates its own writable clone automatically.
# shell_tc_overlay_mode=auto   # options: auto (default), enabled, disabled
# shell_tc_overlay_dir=<work_dir>/shell_tc_overlay
# Optional: branch of shell testcases repo to use (if not available, fallback to origin)
# Applies only to the repo at shell_tc_dir. Default is 'develop'.
shell_tc_branch=develop

# Build configuration
# build_arg: Base arguments for ./build.sh (without -m flag, which is added dynamically based on buildType from JSON)
# build_dir: Dynamically constructed as build_x86_64_{buildType} where buildType comes from JSON payload
build_arg=-g ninja -c -DENABLE_SYSTEMTAP=OFF build

# Working directory
work_dir=~/tmp/builder_work

# Tester service configuration
tester_port=8090

# Test execution configuration
# Run mode determines how tests are executed (unified semantics):
# - until-pass: May stop early on first PASS (after min_runs)
# - until-fail: May stop early on first FAIL (after min_runs)
# - fixed-runs: Never stops early
run_mode=fixed-runs

# Unified run controls
# min_runs: lower bound (>=1); max_runs: upper bound (>= min_runs)
# time_budget_ms: optional time budget stop condition (>=1)
min_runs=3
max_runs=5
# time_budget_ms=600000

# Smart Scheduling Configuration
# Enable intelligent multi-resource scheduling (true/false)
# When enabled, replaces legacy round-robin with cache-aware, resource-based scheduling
smart_scheduling_enabled=true

# Scheduling Algorithm Parameters
# Mice threshold: tests with predicted duration ≤ this are "mice" (short tests), others are "elephants"
scheduling_mice_threshold_ms=20000

# Scoring weights (must sum to ~1.0 for balanced scoring)
# Weight for resource pressure (bin-packing efficiency)
scheduling_weight_pressure=0.45
# Weight for predicted test duration
scheduling_weight_duration=0.25
# Weight for Docker image cache locality (prefer nodes with cached images)
scheduling_weight_image_cache=0.15
# (Legacy doc key: scheduling_weight_image)
# Weight for build package cache locality
scheduling_weight_package_cache=0.05
# (Legacy doc key: scheduling_weight_package)
# Weight for queue aging (fairness - boost long-waiting tests)
scheduling_weight_age_boost=0.10
# (Legacy doc key: scheduling_weight_age)

# Node polling and staleness detection
# How often to poll tester /health endpoints (seconds)
scheduling_node_poll_interval_seconds=5
# (Legacy doc key: scheduling_poll_interval_ms)
# Mark nodes as stale if no heartbeat received for this duration (seconds)
scheduling_node_stale_threshold_seconds=30
# (Legacy doc key: scheduling_stale_threshold_ms)

# Preferred tester nodes for smart scheduling (host:port)
# The scheduler also accepts workerIps from build requests; this list documents
# the default cluster layout we operate today.
smart_scheduling_tester_nodes=192.168.1.5:8090,192.168.1.15:8090,192.168.2.154:8090
# (192.168.1.5 is reachable locally via localhost:8090)

# Docker configuration
use_docker=true
use_prebuilt_docker_images=true
docker_build_image=cubridci/cubridci:develop
docker_test_image=cubridci/cubridci:test_shell

# Keep failed test containers alive for debugging (true/false)
keep_failed_containers=false

# Docker resource limits (default: enabled with configured limits)
# When enabled, limits can come from:
#   1. Configured values below (if set)
#   2. Predicted demand from smart scheduling (if available)
#   3. Minimum safe defaults
# Set to false to disable resource limits entirely
docker_enforce_cpu_limits=true
docker_enforce_memory_limits=true

# Resource limit override values (optional)
# If set, these override predicted demand values
# Leave commented/unset to use predicted demand when enforcement is enabled

# CPU limit in millicores (1000 millicores = 1 CPU core)
# Default: 2000 millicores = 2 CPU cores
# Minimum: 100 millicores (0.1 cores) for bootstrapping
docker_cpu_limit_millicores=2000

# Memory limit in MB
# Default: 4096 MB = 4 GB
# Minimum: 256 MB
docker_memory_limit_mb=4096

# I/O throughput limits in MB/s
# Requires specifying a block device (auto-detected if not set)
docker_io_read_limit_mbps=300
docker_io_write_limit_mbps=200

# Block device for I/O limits (optional, auto-detected if not specified)
# Examples: /dev/sda, /dev/nvme0n1, /dev/vda
# Leave commented for automatic detection
#docker_io_device=/dev/sda

# Build timeout (minutes)
build_timeout_minutes=180

# Build cache configuration
build_cache_size=40

# Ccache configuration (compiler cache for faster rebuilds)
ccache_enabled=true
ccache_dir=$HOME/docker-work/work/.ccache
ccache_max_size=30G
ccache_compilercheck=mtime
ccache_hardlink=true
ccache_sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime

# Parallel build configuration
# Number of parallel jobs for make/ninja (0 = auto-detect from CPU cores)
parallel_jobs=0

# Log management configuration
# Maximum number of request log directories to keep
max_request_logs=20

# Maximum number of tar build files to keep in work directory
max_tar_files=5

# Enable request-based log grouping (true/false)
enable_request_grouping=true

# HTTP timeouts for fetching logs from remote testers (in seconds)
# These apply when retrieving test execution logs via HTTP
log_fetch_connect_timeout_seconds=10
log_fetch_read_timeout_seconds=120
