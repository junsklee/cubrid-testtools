# Tester Service Configuration

# Server configuration
tester_port=8090

# Legacy single concurrency limit (kept for backward compatibility).
# Leave unset if you only use the dual-mode controls below.
max_concurrent_tests=28

# Dual-mode concurrency controls: the tester advertises/uses a lower cap while
# any heavy tests are still running locally, then relaxes to the post-heavy cap
# once the heavy backlog clears. Defaults fall back to max_concurrent_tests.
max_concurrent_tests_heavy_queue=28
max_concurrent_tests_post_heavy=42

# Smart Scheduling Metrics & Health (per docs/SMART_SCHEDULING_TESTING_GUIDE.md)
# Node identity: this tester advertises as 192.168.1.5:8090 (also reachable via localhost)
stats_enabled=true
stats_snapshot_interval_seconds=300          # Snapshot every 5 minutes
heartbeat_interval_seconds=5                 # Report health every 5 seconds
score_endpoint_enabled=true                  # Enable /score endpoint for predictions

# Node capacity for smart scheduling
# IOPS capacity of the node (affects how many tests can run concurrently)
# Recommendations based on storage type:
#   15000 = Conservative (HDD or shared VM) - fits 3-4 tests
#   25000 = Moderate (SATA SSD) - fits 6 tests
#   35000 = Aggresio_safety_headroom_ratiosive (NVMe SSD) - fits 8 tests
#   50000 = Future-proof (high-end storage) - fits 10+ tests
node_iops_capacity=50000

# Additional node capacity overrides (optional)
# Defaults are auto-detected or estimated at startup.
# node_cpu_capacity=8000       # CPU capacity in millicores (e.g. 8000 = 8 cores)
# node_mem_mb_capacity=16384.0 # Memory capacity in MB
node_io_mb_capacity=5000.0     # Total I/O throughput (read+write) in MB/s
# node_net_mb_capacity=1000.0  # Network throughput in MB/s

# Smart scheduling thresholds (IO-prioritized defaults)
scheduling_mice_threshold_ms=60000
scheduling_io_heavy_threshold=40

# Elastic Overcommit & Circuit Breaker (maximize utilization safely)
# ----------------------------------------------------------------
# Overcommit: Treat node as having more resources than physical (e.g., 1.5 = 150% capacity).
# This relies on statistical multiplexing (tests rarely peak simultaneously).
scheduling_overcommit_cpu=1.5
scheduling_overcommit_mem=0.9

# Circuit Breaker: Hard safety stop based on REAL-TIME OS metrics.
# If actual usage exceeds these % thresholds, admission stops regardless of theoretical headroom.
scheduling_circuit_breaker_cpu=95.0
scheduling_circuit_breaker_mem=80.0

# Safety Headroom: Portion of capacity strictly reserved for system overhead/safety.
io_safety_headroom_ratio=0.20

# Source directories
cubrid_src_dir=~/cubrid
shell_tc_dir=~/cubrid-testcases-private-ex
# Optional: branch of shell testcases repo to use (if not available, fallback to origin)
# Applies only to the repo at shell_tc_dir. Default is 'develop'.
shell_tc_branch=develop
# Optional: Specify the preferred remote name for the shell testcases git repository.
# By default, this is set to 'upstream'. If the specified remote does not exist,
# the system will automatically fall back to using 'origin' if it is available.
shell_tc_preferred_remote=upstream

# Git sync mode for shell testcases repository
# Controls when git sync (fetch + checkout) is performed:
#   per_request - sync once per request ID (default, recommended for Docker overlay)
#   per_test    - sync on every test, respecting interval (legacy behavior)
#   disabled    - never sync (useful when testcases are managed externally)
shell_tc_sync_mode=per_request

# Build configuration (for extraction)
build_dir=build_x86_64_debug

# Working directory
work_dir=~/tmp/tester_work

# Docker configuration
use_docker_tester=true
use_prebuilt_docker_images=true
docker_test_image=cubridci/cubridci:test_shell
keep_failed_containers=false

# Docker resource limits (default: enabled with configured limits)
# When enabled, limits can come from:
#   1. Configured values below (if set)
#   2. Predicted demand from smart scheduling (if available)
#   3. Minimum safe defaults
# Set to false to disable resource limits entirely
docker_enforce_cpu_limits=false
docker_enforce_memory_limits=false

# Resource limit override values (optional)
# If set, these override predicted demand values
# Leave commented/unset to use predicted demand when enforcement is enabled

# CPU limit in millicores (1000 millicores = 1 CPU core)
# Default: 7000 millicores = 7 CPU cores
# Minimum: 100 millicores (0.1 cores) for bootstrapping
docker_cpu_limit_millicores=7000

# Memory limit in MB
# Default: 4096 MB = 4 GB
# Minimum: 256 MB
docker_memory_limit_mb=4096

# I/O throughput limits in MB/s
# Requires specifying a block device (auto-detected if not set)
docker_io_read_limit_mbps=800
docker_io_write_limit_mbps=700

# Block device for I/O limits (optional, auto-detected if not specified)
# Examples: /dev/sda, /dev/nvme0n1, /dev/vda
# Leave commented for automatic detection
#docker_io_device=/dev/sda

# Docker optimization
# Enable optimized Docker execution with pre-built images (true/false)
# This builds Docker images with CUBRID pre-installed for each commit
optimized_docker_enabled=true

# Build cache size (number of Docker images to keep)
# Each image is ~1-2GB, so adjust based on available disk space
build_cache_size=10

# Log management configuration  
# Maximum number of request log directories to keep
max_request_logs=5

# Enable request-based log grouping (true/false)
enable_request_grouping=true

# Log file verification timeout (in seconds)
# Time to wait after writing log files before returning test results to builder
# This prevents timing issues where files are written but not yet accessible via HTTP
log_file_verification_timeout_seconds=5

# Smart Scheduling - Metrics Collection and Prediction
# (see top of file for the primary configuration entries)

# Actual Resource Sampling (for utilization_actual in /health endpoint)
# Enable real-time resource usage sampling from running Docker containers
actual_sampling_enabled=true

# Docker container name pattern for identifying test containers
# Only containers matching this pattern will be included in actual utilization metrics
test_container_pattern=tester_

# Minimum interval between samples for I/O rate calculation (milliseconds)
# Prevents jitter from very close samples. Rates are calculated from deltas between samples.
# Default: 500ms (ensures at least 0.5 second between delta calculations)
actual_sampling_min_interval_ms=500

# Cache TTL for container sample history (seconds)
# Previous samples older than this are cleaned up to prevent memory leaks.
# Should be >= heartbeat_interval to ensure delta tracking works.
# Default: 60 seconds
actual_sampling_cache_ttl_seconds=60
