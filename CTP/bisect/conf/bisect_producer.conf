# Bisect Producer Configuration Example
# Copy this file to bisect_producer.conf and modify as needed

# HTTP server port for receiving bisect requests
listen_port=8089

# Path to CUBRID source code repository
# This should be a git repository with full history
# Will be automatically cloned from git@github.com:CUBRID/cubrid.git if it doesn't exist
cubrid_src_dir=~/cubrid-src

# Path to shell test cases repository
# This directory should contain the shell test scripts
shell_tc_dir=~/cubrid-testcases-private-ex

# Build arguments for CUBRID
# For debug build: -g ninja -m debug build
# For release build: -g ninja -m release build
build_arg=-g ninja -m debug build

# Build directory name (created under cubrid_src_dir)
# This directory will be removed and recreated for each build
build_dir=build_x86_64_debug

# Working directory for temporary files
# Judge scripts and build packages will be created here
work_dir=/tmp/bisect_work

# Consumer port
# The port where consumer nodes are listening for test requests
consumer_port=8090

# Maximum concurrent bisect operations
# Adjust based on available system resources
max_concurrent_bisects=4

# Docker configuration
# Enable Docker-based builds for better isolation and consistency
use_docker=true

# Use pre-built Docker images from Docker Hub (faster than building from source)
# Set to false to build images from cubridci repository
use_prebuilt_docker_images=true

# Docker image names 
# If use_prebuilt_docker_images=true: pulls cubridci/cubridci:develop and cubridci/cubridci:test_shell
# If use_prebuilt_docker_images=false: builds from cubridci repository
docker_build_image=cubrid-bisect-builder:latest
docker_test_image=cubrid-bisect-tester:latest
